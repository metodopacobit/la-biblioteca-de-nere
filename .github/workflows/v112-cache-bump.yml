name: Aplicar cache v1.12 una vez

on:
  push:
    branches:
      - agent/v112-cache-bump

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: agent/v112-cache-bump

      - name: Cambiar versión y validar
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          antiguo = 'correccion-buscador-v18.js?v=1.8'
          nuevo = 'correccion-buscador-v18.js?v=1.12'
          if antiguo not in s:
              raise SystemExit('No se encontró la referencia antigua en index.html')
          p.write_text(s.replace(antiguo, nuevo, 1), encoding='utf-8')
          PY
          node --check nere-v112-fix.js
          grep -F 'correccion-buscador-v18.js?v=1.12' index.html
          ! grep -F 'correccion-buscador-v18.js?v=1.8' index.html

      - name: Guardar y retirar esta tarea
        shell: bash
        run: |
          rm .github/workflows/v112-cache-bump.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fuerza carga limpia de la v1.12'
          git push origin HEAD:agent/v112-cache-bump
