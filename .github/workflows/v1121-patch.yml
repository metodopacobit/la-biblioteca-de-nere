name: Aplicar v1.12.1 una vez

on:
  push:
    branches:
      - agent/v1121-declarado-fix

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1121-declarado-fix

      - name: Ajustar idioma, Awin y caché
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('nere-v112-fix.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('/* La Biblioteca de Nere · v1.12 · idioma estricto y compra por ISBN */', '/* La Biblioteca de Nere · v1.12.1 · idioma estricto y compra por ISBN */', 1)
          old = '    const declarado = String(registro?.[9] || "").toLowerCase().trim();\n    if (Object.prototype.hasOwnProperty.call(puntos, declarado)) puntos[declarado] += 6;'
          new = '    const declarado = String(registro?.[9] || "").toLowerCase().trim();\n    // Una declaración extranjera explícita tiene prioridad sobre el grupo ISBN.\n    // Esto evita que una edición catalana con ISBN 97884 se convierta en castellana.\n    if (declarado && declarado !== "es" && Object.prototype.hasOwnProperty.call(PERFIL, declarado)) return declarado;\n    if (Object.prototype.hasOwnProperty.call(puntos, declarado)) puntos[declarado] += 6;'
          if old not in s:
              raise SystemExit('No se encontró el bloque de idioma esperado')
          s = s.replace(old, new, 1)
          old2 = '      "&awinaffid=" + AWIN_AFF +\n      "&clickref=" + encodeURIComponent("nere-" + tipo) +\n      "&ued=" + encodeURIComponent(destino);'
          new2 = '      "&awinaffid=" + AWIN_AFF +\n      "&fix=1" +\n      "&clickref=" + encodeURIComponent("nere-" + tipo) +\n      "&ued=" + encodeURIComponent(destino);'
          if old2 not in s:
              raise SystemExit('No se encontró el bloque Awin esperado')
          s = s.replace(old2, new2, 1)
          s = s.replace('✅ Nere v1.12 · idioma estricto y enlaces por ISBN activos', '✅ Nere v1.12.1 · idioma estricto y enlaces por ISBN activos', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('correccion-buscador-v18.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('cargador v1.12', 'cargador v1.12.1', 1)
          s = s.replace('__nereV112Loader', '__nereV1121Loader')
          s = s.replace('v=1.12', 'v=1.12.1')
          s = s.replace('Nere v1.12', 'Nere v1.12.1')
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'correccion-buscador-v18.js?v=1.12'
          new = 'correccion-buscador-v18.js?v=1.12.1'
          if old not in s:
              raise SystemExit('No se encontró la caché v1.12 en index.html')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          node --check nere-v112-fix.js
          node --check correccion-buscador-v18.js
          grep -F 'declarado !== "es"' nere-v112-fix.js
          grep -F '"&fix=1"' nere-v112-fix.js
          grep -F 'correccion-buscador-v18.js?v=1.12.1' index.html

      - name: Guardar y retirar esta tarea
        shell: bash
        run: |
          rm .github/workflows/v1121-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Ajusta idioma declarado y enlace Awin v1.12.1'
          git push origin HEAD:agent/v1121-declarado-fix
