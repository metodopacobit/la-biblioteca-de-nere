<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>La Biblioteca de Nere</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f4ef;
      color: #222;
    }

    header {
      background: white;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 5px 0 0;
      color: #666;
    }

    main {
      padding: 14px;
      max-width: 900px;
      margin: auto;
    }

    .oculto {
      display: none;
    }

    .buscador-box {
      background: white;
      padding: 14px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .fila-busqueda {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #bbb;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      cursor: pointer;
    }

    .filtros {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .filtro {
      padding: 7px 12px;
      border-radius: 999px;
      background: #eee;
    }

    .filtro.activo {
      background: #222;
      color: white;
    }

    #mensaje {
      margin-top: 12px;
      color: #666;
      font-size: 14px;
    }

    #resultados,
    #listaBiblioteca {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .libro {
      background: white;
      border-radius: 14px;
      padding: 9px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      cursor: pointer;
    }

    .portada-wrap {
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #eee;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .portada-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .sin-portada {
      font-size: 48px;
    }

    .libro h3 {
      font-size: 15px;
      margin: 9px 0 4px;
    }

    .libro p {
      margin: 3px 0;
      font-size: 13px;
      color: #555;
    }

    .anio {
      font-size: 12px;
      color: #777;
    }

    .mi-biblioteca {
      margin-top: 24px;
    }

    .categoria {
      background: white;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      cursor: pointer;
    }

    .ficha {
      background: white;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .volver {
      margin-bottom: 16px;
      background: #eee;
    }

    .ficha-portada {
      width: 170px;
      max-width: 60%;
      margin: auto;
      display: block;
      border-radius: 10px;
    }

    .ficha-sin-portada {
      height: 230px;
      width: 170px;
      max-width: 60%;
      margin: auto;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      border-radius: 10px;
    }

    .ficha h2 {
      margin-bottom: 5px;
    }

    .ficha-autor {
      color: #555;
    }

    .acciones {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .btn-guardar {
      text-align: left;
      background: #f1f1f1;
      width: 100%;
    }

    .btn-leer {
      background: #1f7a3f;
      color: white;
      font-weight: bold;
      text-align: center;
      width: 100%;
      margin-top: 12px;
    }

    .estado-actual {
      margin-top: 12px;
      font-weight: bold;
    }

    .disponibilidad {
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      background: #f2f2f2;
    }

    .titulo-biblioteca {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
    }

    @media (min-width: 700px) {
      #resultados,
      #listaBiblioteca {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <h1>📚 La Biblioteca de Nere</h1>
  <p>Tu biblioteca digital</p>
</header>

<main>

  <!-- PANTALLA PRINCIPAL -->
  <section id="pantallaInicio">

    <section class="buscador-box">

      <h2>Buscar libros</h2>

      <div class="fila-busqueda">

        <input
          id="buscador"
          type="text"
          placeholder="Título o autor..."
          autocomplete="off"
        >

        <button onclick="buscarLibros()">
          Buscar
        </button>

      </div>

      <div class="filtros">

        <button
          id="filtroTodo"
          class="filtro activo"
          onclick="cambiarFiltro('todo')"
        >
          Todo
        </button>

        <button
          id="filtroTitulo"
          class="filtro"
          onclick="cambiarFiltro('titulo')"
        >
          Título
        </button>

        <button
          id="filtroAutor"
          class="filtro"
          onclick="cambiarFiltro('autor')"
        >
          Autor
        </button>

        <button
          id="filtroGratis"
          class="filtro"
          onclick="cambiarFiltro('gratis')"
        >
          🟢 Gratis
        </button>

      </div>

      <div id="mensaje"></div>

    </section>

    <section id="resultados"></section>


    <section class="mi-biblioteca">

      <h2>Mi biblioteca</h2>

      <div
        class="categoria"
        onclick="abrirBiblioteca('quiero')"
      >
        ❤️ Quiero leer
      </div>

      <div
        class="categoria"
        onclick="abrirBiblioteca('leyendo')"
      >
        📖 Leyendo
      </div>

      <div
        class="categoria"
        onclick="abrirBiblioteca('leidos')"
      >
        ✅ Leídos
      </div>

    </section>

  </section>


  <!-- FICHA LIBRO -->
  <section
    id="pantallaFicha"
    class="oculto"
  >

    <button
      class="volver"
      onclick="volverInicio()"
    >
      ← Volver
    </button>

    <div
      id="contenidoFicha"
      class="ficha"
    ></div>

  </section>


  <!-- BIBLIOTECA -->
  <section
    id="pantallaBiblioteca"
    class="oculto"
  >

    <button
      class="volver"
      onclick="volverInicio()"
    >
      ← Volver
    </button>

    <div class="titulo-biblioteca">
      <h2 id="tituloBiblioteca"></h2>
    </div>

    <div id="listaBiblioteca"></div>

  </section>

</main>


<script>

let filtroActual = "todo";
let libroSeleccionado = null;

let biblioteca =
  JSON.parse(localStorage.getItem("bibliotecaNere"))
  || [];


function guardarBiblioteca() {

  localStorage.setItem(
    "bibliotecaNere",
    JSON.stringify(biblioteca)
  );

}


function cambiarFiltro(tipo) {

  filtroActual = tipo;

  document
    .querySelectorAll(".filtro")
    .forEach(
      boton =>
        boton.classList.remove("activo")
    );

  if (tipo === "todo") {
    document
      .getElementById("filtroTodo")
      .classList.add("activo");
  }

  if (tipo === "titulo") {
    document
      .getElementById("filtroTitulo")
      .classList.add("activo");
  }

  if (tipo === "autor") {
    document
      .getElementById("filtroAutor")
      .classList.add("activo");
  }

  if (tipo === "gratis") {
    document
      .getElementById("filtroGratis")
      .classList.add("activo");
  }

}


async function buscarLibros() {

  const texto =
    document
      .getElementById("buscador")
      .value
      .trim();

  const mensaje =
    document.getElementById("mensaje");

  const resultados =
    document.getElementById("resultados");


  if (!texto) {

    mensaje.innerHTML =
      "Escribe un título o autor.";

    resultados.innerHTML = "";

    return;

  }


  mensaje.innerHTML =
    "🔎 Buscando...";

  resultados.innerHTML = "";


  try {

    let consulta = "";

    if (filtroActual === "titulo") {

      consulta =
        "title=" +
        encodeURIComponent(texto);

    }

    else if (filtroActual === "autor") {

      consulta =
        "author=" +
        encodeURIComponent(texto);

    }

    else if (filtroActual === "gratis") {

      consulta =
        "q=" +
        encodeURIComponent(
          texto + " ebook_access:public"
        );

    }

    else {

      consulta =
        "q=" +
        encodeURIComponent(texto);

    }


    const url =
      "https://openlibrary.org/search.json?"
      + consulta
      + "&fields=key,title,author_name,first_publish_year,cover_i,ebook_access,ia"
      + "&limit=20";


    const respuesta =
      await fetch(url);


    if (!respuesta.ok) {
      throw new Error("Error en Open Library");
    }


    const datos =
      await respuesta.json();


    if (!datos.docs?.length) {

      mensaje.innerHTML =
        "No se encontraron libros.";

      return;

    }


    let libros = datos.docs;


    if (filtroActual === "todo") {

      const buscado =
        texto.toLowerCase();

      libros.sort((a, b) => {

        function puntos(libro) {

          let total = 0;

          const titulo =
            (libro.title || "")
              .toLowerCase();

          const autores =
            (libro.author_name || [])
              .join(" ")
              .toLowerCase();

          if (titulo === buscado) {
            total += 10;
          }

          if (titulo.includes(buscado)) {
            total += 5;
          }

          if (autores.includes(buscado)) {
            total += 7;
          }

          return total;

        }

        return puntos(b) - puntos(a);

      });

    }


    libros =
      libros.slice(0, 12);


    mensaje.innerHTML =
      "Resultados encontrados";


    libros.forEach(libro => {

      pintarLibro(
        libro,
        resultados
      );

    });


  }

  catch (error) {

    console.error(error);

    mensaje.innerHTML =
      "❌ Error al buscar libros.";

  }

}


function pintarLibro(libro, contenedor) {

  const titulo =
    libro.title
    || libro.titulo
    || "Sin título";

  const autor =
    libro.author_name?.[0]
    || libro.autor
    || "Autor desconocido";

  const año =
    libro.first_publish_year
    || libro.año
    || "";

  const coverId =
    libro.cover_i
    || libro.coverId
    || null;

  const ebookAccess =
    libro.ebook_access
    || libro.ebookAccess
    || null;

  let ia = null;

  if (Array.isArray(libro.ia)) {
    ia = libro.ia[0] || null;
  } else {
    ia = libro.ia || null;
  }


  let portada = "";


  if (coverId) {

    portada =
      `
      <img
        src="https://covers.openlibrary.org/b/id/${coverId}-M.jpg"
        alt="${titulo}"
      >
      `;

  }

  else {

    portada =
      `
      <div class="sin-portada">
        📚
      </div>
      `;

  }


  const tarjeta =
    document.createElement("article");

  tarjeta.className =
    "libro";


  tarjeta.innerHTML =
    `
    <div class="portada-wrap">
      ${portada}
    </div>

    <h3>${titulo}</h3>

    <p>${autor}</p>

    <div class="anio">
      ${año}
    </div>
    `;


  tarjeta.onclick =
    function() {

      abrirFicha({

        titulo: titulo,

        autor: autor,

        año: año,

        coverId: coverId,

        key:
          libro.key
          || libro.keyLibro
          || titulo + autor,

        ebookAccess:
          ebookAccess,

        ia:
          ia

      });

    };


  contenedor.appendChild(
    tarjeta
  );

}


async function abrirFicha(libro) {

  libroSeleccionado =
    libro;


  document
    .getElementById("pantallaInicio")
    .classList
    .add("oculto");

  document
    .getElementById("pantallaBiblioteca")
    .classList
    .add("oculto");

  document
    .getElementById("pantallaFicha")
    .classList
    .remove("oculto");


  const ficha =
    document
      .getElementById("contenidoFicha");


  ficha.innerHTML =
    "Cargando ficha...";


  let descripcion =
    "Sin descripción disponible.";


  try {

    if (
      libro.key
      &&
      libro.key.startsWith("/works/")
    ) {

      const respuesta =
        await fetch(
          "https://openlibrary.org"
          + libro.key
          + ".json"
        );

      if (respuesta.ok) {

        const datos =
          await respuesta.json();


        if (
          typeof datos.description
          === "string"
        ) {

          descripcion =
            datos.description;

        }

        else if (
          datos.description?.value
        ) {

          descripcion =
            datos.description.value;

        }

      }

    }

  }

  catch (error) {

    console.log(
      "No se pudo cargar descripción"
    );

  }


  let portada = "";


  if (libro.coverId) {

    portada =
      `
      <img
        class="ficha-portada"
        src="https://covers.openlibrary.org/b/id/${libro.coverId}-L.jpg"
        alt="${libro.titulo}"
      >
      `;

  }

  else {

    portada =
      `
      <div class="ficha-sin-portada">
        📚
      </div>
      `;

  }


  const guardado =
    biblioteca.find(
      item =>
        item.key === libro.key
    );


  let estado = "";

  if (guardado) {

    estado =
      `
      <div class="estado-actual">
        Guardado en:
        ${nombreEstado(
          guardado.estado
        )}
      </div>
      `;

  }


  let zonaLectura = "";


  if (
    libro.ebookAccess === "public"
    && libro.ia
  ) {

    zonaLectura =
      `
      <div class="disponibilidad">
        🟢 Este libro tiene una copia pública disponible.
      </div>

      <button
        class="btn-leer"
        onclick="leerLibro('${libro.ia}')"
      >
        📖 Leer gratis
      </button>
      `;

  }

  else {

    zonaLectura =
      `
      <div class="disponibilidad">
        🔒 No hay una copia gratuita disponible para leer desde esta ficha.
      </div>
      `;

  }


  ficha.innerHTML =
    `
    ${portada}

    <h2>
      ${libro.titulo}
    </h2>

    <p class="ficha-autor">
      ${libro.autor}
    </p>

    <p>
      ${libro.año}
    </p>

    ${zonaLectura}

    <h3>Descripción</h3>

    <p>
      ${descripcion}
    </p>

    ${estado}

    <div class="acciones">

      <button
        class="btn-guardar"
        onclick="guardarLibro('quiero')"
      >
        ❤️ Quiero leer
      </button>

      <button
        class="btn-guardar"
        onclick="guardarLibro('leyendo')"
      >
        📖 Estoy leyendo
      </button>

      <button
        class="btn-guardar"
        onclick="guardarLibro('leidos')"
      >
        ✅ Leído
      </button>

    </div>
    `;

}


function leerLibro(identifier) {

  window.open(
    "https://archive.org/details/"
    + identifier,
    "_blank"
  );

}


function guardarLibro(estado) {

  if (!libroSeleccionado) {
    return;
  }


  const existente =
    biblioteca.find(
      libro =>
        libro.key
        === libroSeleccionado.key
    );


  if (existente) {

    existente.estado =
      estado;

    existente.ebookAccess =
      libroSeleccionado.ebookAccess;

    existente.ia =
      libroSeleccionado.ia;

  }

  else {

    biblioteca.push({

      key:
        libroSeleccionado.key,

      titulo:
        libroSeleccionado.titulo,

      autor:
        libroSeleccionado.autor,

      año:
        libroSeleccionado.año,

      coverId:
        libroSeleccionado.coverId,

      ebookAccess:
        libroSeleccionado.ebookAccess,

      ia:
        libroSeleccionado.ia,

      estado:
        estado

    });

  }


  guardarBiblioteca();


  alert(
    "Libro guardado en "
    + nombreEstado(estado)
  );


  abrirFicha(
    libroSeleccionado
  );

}


function nombreEstado(estado) {

  if (estado === "quiero") {
    return "❤️ Quiero leer";
  }

  if (estado === "leyendo") {
    return "📖 Leyendo";
  }

  if (estado === "leidos") {
    return "✅ Leídos";
  }

  return "";

}


function abrirBiblioteca(estado) {

  document
    .getElementById("pantallaInicio")
    .classList
    .add("oculto");

  document
    .getElementById("pantallaFicha")
    .classList
    .add("oculto");

  document
    .getElementById("pantallaBiblioteca")
    .classList
    .remove("oculto");


  document
    .getElementById("tituloBiblioteca")
    .innerHTML =
      nombreEstado(estado);


  const lista =
    document
      .getElementById("listaBiblioteca");


  lista.innerHTML = "";


  const libros =
    biblioteca.filter(
      libro =>
        libro.estado === estado
    );


  if (libros.length === 0) {

    lista.innerHTML =
      "<p>No tienes libros aquí todavía.</p>";

    return;

  }


  libros.forEach(libro => {

    pintarLibro(
      {
        title:
          libro.titulo,

        autor:
          libro.autor,

        año:
          libro.año,

        coverId:
          libro.coverId,

        keyLibro:
          libro.key,

        ebookAccess:
          libro.ebookAccess,

        ia:
          libro.ia
      },

      lista
    );

  });

}


function volverInicio() {

  document
    .getElementById("pantallaFicha")
    .classList
    .add("oculto");

  document
    .getElementById("pantallaBiblioteca")
    .classList
    .add("oculto");

  document
    .getElementById("pantallaInicio")
    .classList
    .remove("oculto");

}


document
  .getElementById("buscador")
  .addEventListener(
    "keydown",
    function(evento) {

      if (
        evento.key === "Enter"
      ) {

        buscarLibros();

      }

    }
  );

</script>

</body>
</html>
