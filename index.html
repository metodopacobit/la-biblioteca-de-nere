<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>La Biblioteca de Nere</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f4ef;
      color: #222;
    }

    header {
      background: white;
      padding: 22px 18px 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 6px 0 0;
      color: #666;
    }

    main {
      padding: 18px;
      max-width: 900px;
      margin: auto;
    }

    h2 {
      margin-top: 10px;
    }

    .buscador-box {
      background: white;
      padding: 14px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .fila-busqueda {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #bbb;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 16px;
      cursor: pointer;
    }

    .filtros {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .filtro {
      padding: 8px 12px;
      border-radius: 999px;
      background: #eee;
      font-size: 14px;
    }

    .filtro.activo {
      background: #222;
      color: white;
    }

    #mensaje {
      margin-top: 14px;
      color: #555;
    }

    #resultados {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 18px;
    }

    .libro {
      background: white;
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .portada-wrap {
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #eee;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .portada-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .sin-portada {
      font-size: 48px;
    }

    .libro h3 {
      font-size: 16px;
      margin: 10px 0 6px;
    }

    .libro p {
      margin: 4px 0;
      font-size: 14px;
      color: #555;
    }

    .anio {
      font-size: 13px;
      color: #777;
    }

    .mi-biblioteca {
      margin-top: 28px;
    }

    .categoria {
      background: white;
      margin-bottom: 10px;
      padding: 14px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      font-size: 16px;
    }

    @media (min-width: 700px) {
      #resultados {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <h1>📚 La Biblioteca de Nere</h1>
  <p>Tu biblioteca digital</p>
</header>

<main>

  <section class="buscador-box">

    <h2>Buscar libros</h2>

    <div class="fila-busqueda">

      <input
        id="buscador"
        type="text"
        placeholder="Título o autor..."
        autocomplete="off"
      >

      <button onclick="buscarLibros()">
        Buscar
      </button>

    </div>

    <div class="filtros">

      <button
        class="filtro activo"
        id="filtroTodo"
        onclick="cambiarFiltro('todo')"
      >
        Todo
      </button>

      <button
        class="filtro"
        id="filtroTitulo"
        onclick="cambiarFiltro('titulo')"
      >
        Título
      </button>

      <button
        class="filtro"
        id="filtroAutor"
        onclick="cambiarFiltro('autor')"
      >
        Autor
      </button>

    </div>

    <div id="mensaje"></div>

  </section>


  <section id="resultados"></section>


  <section class="mi-biblioteca">

    <h2>Mi biblioteca</h2>

    <div class="categoria">
      ❤️ Quiero leer
    </div>

    <div class="categoria">
      📖 Leyendo
    </div>

    <div class="categoria">
      ✅ Leídos
    </div>

  </section>

</main>


<script>

let filtroActual = "todo";


function cambiarFiltro(tipo) {

  filtroActual = tipo;

  document
    .querySelectorAll(".filtro")
    .forEach(boton => boton.classList.remove("activo"));

  if (tipo === "todo") {
    document.getElementById("filtroTodo").classList.add("activo");
  }

  if (tipo === "titulo") {
    document.getElementById("filtroTitulo").classList.add("activo");
  }

  if (tipo === "autor") {
    document.getElementById("filtroAutor").classList.add("activo");
  }

}


async function buscarLibros() {

  const texto =
    document.getElementById("buscador").value.trim();

  const mensaje =
    document.getElementById("mensaje");

  const resultados =
    document.getElementById("resultados");

  if (!texto) {

    mensaje.innerHTML =
      "Escribe un título o autor.";

    resultados.innerHTML = "";

    return;

  }

  mensaje.innerHTML =
    "🔎 Buscando...";

  resultados.innerHTML = "";


  try {

    let consulta = "";

    if (filtroActual === "titulo") {

      consulta =
        "title=" + encodeURIComponent(texto);

    } else if (filtroActual === "autor") {

      consulta =
        "author=" + encodeURIComponent(texto);

    } else {

      consulta =
        "q=" + encodeURIComponent(texto);

    }


    const url =
      "https://openlibrary.org/search.json?" +
      consulta +
      "&limit=20";


    const respuesta =
      await fetch(url);


    if (!respuesta.ok) {

      throw new Error(
        "Error al consultar Open Library"
      );

    }


    const datos =
      await respuesta.json();


    if (!datos.docs || datos.docs.length === 0) {

      mensaje.innerHTML =
        "No se encontraron libros.";

      return;

    }


    let libros = datos.docs;


    if (filtroActual === "todo") {

      const textoNormalizado =
        texto.toLowerCase();

      libros =
        libros.sort((a, b) => {

          const tituloA =
            (a.title || "").toLowerCase();

          const tituloB =
            (b.title || "").toLowerCase();

          const autoresA =
            (a.author_name || [])
              .join(" ")
              .toLowerCase();

          const autoresB =
            (b.author_name || [])
              .join(" ")
              .toLowerCase();


          let puntosA = 0;
          let puntosB = 0;


          if (tituloA === textoNormalizado) {
            puntosA += 10;
          }

          if (tituloA.includes(textoNormalizado)) {
            puntosA += 5;
          }

          if (autoresA.includes(textoNormalizado)) {
            puntosA += 7;
          }


          if (tituloB === textoNormalizado) {
            puntosB += 10;
          }

          if (tituloB.includes(textoNormalizado)) {
            puntosB += 5;
          }

          if (autoresB.includes(textoNormalizado)) {
            puntosB += 7;
          }


          return puntosB - puntosA;

        });

    }


    libros =
      libros.slice(0, 12);


    mensaje.innerHTML =
      "Resultados encontrados";


    libros.forEach(libro => {

      const titulo =
        libro.title || "Sin título";

      const autor =
        libro.author_name?.[0]
        || "Autor desconocido";

      const año =
        libro.first_publish_year
        || "";

      let portada = "";


      if (libro.cover_i) {

        portada =
          `
          <img
            src="https://covers.openlibrary.org/b/id/${libro.cover_i}-M.jpg"
            alt="${titulo}"
          >
          `;

      } else {

        portada =
          `
          <div class="sin-portada">
            📚
          </div>
          `;

      }


      const tarjeta =
        document.createElement("article");

      tarjeta.className =
        "libro";


      tarjeta.innerHTML =
        `
        <div class="portada-wrap">
          ${portada}
        </div>

        <h3>${titulo}</h3>

        <p>${autor}</p>

        <div class="anio">
          ${año}
        </div>
        `;


      resultados.appendChild(tarjeta);

    });


  } catch (error) {

    console.error(error);

    mensaje.innerHTML =
      "❌ No se ha podido conectar con la biblioteca.";

  }

}


document
  .getElementById("buscador")
  .addEventListener(
    "keydown",
    function(evento) {

      if (evento.key === "Enter") {

        buscarLibros();

      }

    }
  );

</script>

</body>
</html>
