<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>La Biblioteca de Nere</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f4ef;
      color: #222;
    }

    header {
      background: white;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 5px 0 0;
      color: #666;
    }

    main {
      padding: 14px;
      max-width: 900px;
      margin: auto;
    }

    .oculto {
      display: none !important;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      cursor: pointer;
    }

    .buscador-box {
      background: white;
      padding: 14px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .buscador-box h2 {
      margin-top: 0;
    }

    .fila-busqueda {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #bbb;
    }

    .filtros {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .filtro {
      padding: 7px 12px;
      border-radius: 999px;
      background: #eee;
    }

    .filtro.activo {
      background: #222;
      color: white;
    }

    #mensaje {
      margin-top: 12px;
      color: #666;
      font-size: 14px;
    }

    #resultados,
    #listaBiblioteca {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .libro {
      background: white;
      border-radius: 14px;
      padding: 9px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      cursor: pointer;
    }

    .portada-wrap {
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #eee;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .portada-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .sin-portada {
      font-size: 48px;
    }

    .libro h3 {
      font-size: 15px;
      margin: 9px 0 4px;
    }

    .libro p {
      margin: 3px 0;
      font-size: 13px;
      color: #555;
    }

    .anio {
      font-size: 12px;
      color: #777;
      margin-top: 4px;
    }

    .gratis {
      color: #167638;
      font-weight: bold;
    }

    .mi-biblioteca {
      margin-top: 26px;
    }

    .categoria {
      background: white;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .contador {
      background: #eee;
      min-width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 13px;
    }

    .volver {
      margin-bottom: 16px;
      background: #eee;
    }

    .ficha {
      background: white;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .ficha-portada {
      width: 180px;
      max-width: 60%;
      margin: auto;
      display: block;
      border-radius: 10px;
    }

    .ficha-sin-portada {
      height: 250px;
      width: 180px;
      max-width: 60%;
      margin: auto;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      border-radius: 10px;
    }

    .ficha h2 {
      font-size: 26px;
      margin-bottom: 6px;
    }

    .ficha-autor {
      color: #555;
      font-size: 17px;
    }

    .descripcion {
      line-height: 1.55;
      color: #444;
    }

    .disponibilidad {
      margin: 15px 0;
      padding: 12px;
      border-radius: 10px;
      background: #f1f1f1;
    }

    .disponible {
      background: #e7f6eb;
      color: #145e2b;
    }

    .btn-leer {
      background: #1f7a3f;
      color: white;
      font-weight: bold;
      width: 100%;
      margin: 5px 0 15px;
      font-size: 17px;
    }

    .acciones {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .btn-guardar {
      text-align: left;
      background: #f1f1f1;
      width: 100%;
    }

    .estado-actual {
      background: #fff5d9;
      padding: 11px;
      border-radius: 10px;
      margin-top: 15px;
      font-weight: bold;
    }

    .lector {
      background: #fffdf8;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .lector-cabecera {
      padding-bottom: 14px;
      border-bottom: 1px solid #ddd;
      margin-bottom: 22px;
    }

    .lector-cabecera h2 {
      margin: 0 0 6px;
    }

    .lector-cabecera p {
      margin: 0;
      color: #666;
    }

    .lector-texto {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.75;
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    .cargando {
      text-align: center;
      padding: 40px 15px;
      font-size: 18px;
    }

    @media (min-width: 700px) {
      #resultados,
      #listaBiblioteca {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <h1>📚 La Biblioteca de Nere</h1>
  <p>Tu biblioteca digital</p>
</header>

<main>

  <section id="pantallaInicio">

    <section class="buscador-box">

      <h2>Buscar libros</h2>

      <div class="fila-busqueda">

        <input
          id="buscador"
          type="text"
          placeholder="Título o autor..."
          autocomplete="off"
        >

        <button onclick="buscarLibros()">
          Buscar
        </button>

      </div>

      <div class="filtros">

        <button
          id="filtroTodo"
          class="filtro activo"
          onclick="cambiarFiltro('todo')"
        >
          Todo
        </button>

        <button
          id="filtroTitulo"
          class="filtro"
          onclick="cambiarFiltro('titulo')"
        >
          Título
        </button>

        <button
          id="filtroAutor"
          class="filtro"
          onclick="cambiarFiltro('autor')"
        >
          Autor
        </button>

        <button
          id="filtroGratis"
          class="filtro"
          onclick="cambiarFiltro('gratis')"
        >
          🟢 Gratis
        </button>

      </div>

      <div id="mensaje"></div>

    </section>

    <section id="resultados"></section>

    <section class="mi-biblioteca">

      <h2>Mi biblioteca</h2>

      <div class="categoria" onclick="abrirBiblioteca('quiero')">
        <span>❤️ Quiero leer</span>
        <span id="contadorQuiero" class="contador">0</span>
      </div>

      <div class="categoria" onclick="abrirBiblioteca('leyendo')">
        <span>📖 Leyendo</span>
        <span id="contadorLeyendo" class="contador">0</span>
      </div>

      <div class="categoria" onclick="abrirBiblioteca('leidos')">
        <span>✅ Leídos</span>
        <span id="contadorLeidos" class="contador">0</span>
      </div>

    </section>

  </section>


  <section id="pantallaFicha" class="oculto">

    <button class="volver" onclick="volverInicio()">
      ← Volver
    </button>

    <div id="contenidoFicha" class="ficha"></div>

  </section>


  <section id="pantallaLector" class="oculto">

    <button class="volver" onclick="volverFicha()">
      ← Volver al libro
    </button>

    <div id="contenidoLector" class="lector"></div>

  </section>


  <section id="pantallaBiblioteca" class="oculto">

    <button class="volver" onclick="volverInicio()">
      ← Volver
    </button>

    <h2 id="tituloBiblioteca"></h2>

    <div id="listaBiblioteca"></div>

  </section>

</main>


<script>

const WORKER_URL =
  "https://biblioteca-nere-worker.rjaresarias.workers.dev/";

let filtroActual = "todo";
let libroSeleccionado = null;

let biblioteca =
  JSON.parse(
    localStorage.getItem("bibliotecaNere")
  ) || [];


/* =========================
   UTILIDADES
========================= */

function guardarBiblioteca() {

  localStorage.setItem(
    "bibliotecaNere",
    JSON.stringify(biblioteca)
  );

  actualizarContadores();

}


function actualizarContadores() {

  document.getElementById("contadorQuiero").textContent =
    biblioteca.filter(
      libro => libro.estado === "quiero"
    ).length;

  document.getElementById("contadorLeyendo").textContent =
    biblioteca.filter(
      libro => libro.estado === "leyendo"
    ).length;

  document.getElementById("contadorLeidos").textContent =
    biblioteca.filter(
      libro => libro.estado === "leidos"
    ).length;

}


function ocultarPantallas() {

  document.getElementById("pantallaInicio")
    .classList.add("oculto");

  document.getElementById("pantallaFicha")
    .classList.add("oculto");

  document.getElementById("pantallaLector")
    .classList.add("oculto");

  document.getElementById("pantallaBiblioteca")
    .classList.add("oculto");

}


function escaparHTML(texto) {

  if (!texto) {
    return "";
  }

  return String(texto)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function nombreEstado(estado) {

  if (estado === "quiero") {
    return "❤️ Quiero leer";
  }

  if (estado === "leyendo") {
    return "📖 Leyendo";
  }

  if (estado === "leidos") {
    return "✅ Leídos";
  }

  return "";

}


/* =========================
   FILTROS
========================= */

function cambiarFiltro(tipo) {

  filtroActual = tipo;

  document
    .querySelectorAll(".filtro")
    .forEach(
      boton =>
        boton.classList.remove("activo")
    );

  document
    .getElementById(
      tipo === "todo"
        ? "filtroTodo"
        : tipo === "titulo"
        ? "filtroTitulo"
        : tipo === "autor"
        ? "filtroAutor"
        : "filtroGratis"
    )
    .classList.add("activo");

}


/* =========================
   BUSCADOR
========================= */

async function buscarLibros() {

  const texto =
    document
      .getElementById("buscador")
      .value
      .trim();

  const mensaje =
    document.getElementById("mensaje");

  const resultados =
    document.getElementById("resultados");


  if (!texto) {

    mensaje.textContent =
      "Escribe un título o autor.";

    resultados.innerHTML = "";

    return;

  }


  mensaje.textContent =
    "🔎 Buscando...";

  resultados.innerHTML = "";


  try {

    /* =========================
       LIBROS GRATIS
    ========================= */

    if (filtroActual === "gratis") {

      const respuesta =
        await fetch(
          "https://gutendex.com/books/?search="
          + encodeURIComponent(texto)
        );


      if (!respuesta.ok) {
        throw new Error("Error Gutendex");
      }


      const datos =
        await respuesta.json();


      if (!datos.results?.length) {

        mensaje.textContent =
          "No se encontraron libros gratuitos.";

        return;

      }


      mensaje.textContent =
        "📚 Libros gratuitos encontrados";


      datos.results
        .slice(0, 12)
        .forEach(libro => {

          pintarLibroGratis(
            libro,
            resultados
          );

        });


      return;

    }


    /* =========================
       OPEN LIBRARY
    ========================= */

    let consulta = "";


    if (filtroActual === "titulo") {

      consulta =
        "title="
        + encodeURIComponent(texto);

    }

    else if (filtroActual === "autor") {

      consulta =
        "author="
        + encodeURIComponent(texto);

    }

    else {

      consulta =
        "q="
        + encodeURIComponent(texto);

    }


    const respuesta =
      await fetch(
        "https://openlibrary.org/search.json?"
        + consulta
        + "&fields=key,title,author_name,first_publish_year,cover_i"
        + "&limit=20"
      );


    if (!respuesta.ok) {
      throw new Error("Error Open Library");
    }


    const datos =
      await respuesta.json();


    if (!datos.docs?.length) {

      mensaje.textContent =
        "No se encontraron libros.";

      return;

    }


    let libros =
      datos.docs;


    if (filtroActual === "todo") {

      const buscado =
        texto.toLowerCase();


      libros.sort((a, b) => {

        function puntos(libro) {

          let total = 0;

          const titulo =
            (libro.title || "")
              .toLowerCase();

          const autores =
            (libro.author_name || [])
              .join(" ")
              .toLowerCase();


          if (titulo === buscado) {
            total += 10;
          }

          if (titulo.includes(buscado)) {
            total += 5;
          }

          if (autores.includes(buscado)) {
            total += 7;
          }

          return total;

        }


        return puntos(b) - puntos(a);

      });

    }


    mensaje.textContent =
      "Resultados encontrados";


    libros
      .slice(0, 12)
      .forEach(libro => {

        pintarLibroOpenLibrary(
          libro,
          resultados
        );

      });


  }

  catch (error) {

    console.error(error);

    mensaje.textContent =
      "❌ Error al buscar libros.";

  }

}


/* =========================
   TARJETA OPEN LIBRARY
========================= */

function pintarLibroOpenLibrary(
  libro,
  contenedor
) {

  const titulo =
    libro.title
    || libro.titulo
    || "Sin título";

  const autor =
    libro.author_name?.[0]
    || libro.autor
    || "Autor desconocido";

  const año =
    libro.first_publish_year
    || libro.año
    || "";

  const coverId =
    libro.cover_i
    || libro.coverId
    || null;


  const tarjeta =
    document.createElement("article");


  tarjeta.className =
    "libro";


  tarjeta.innerHTML = `

    <div class="portada-wrap">

      ${
        coverId

        ? `
          <img
            src="https://covers.openlibrary.org/b/id/${coverId}-M.jpg"
            alt="${escaparHTML(titulo)}"
          >
        `

        : `
          <div class="sin-portada">
            📚
          </div>
        `
      }

    </div>

    <h3>
      ${escaparHTML(titulo)}
    </h3>

    <p>
      ${escaparHTML(autor)}
    </p>

    <div class="anio">
      ${escaparHTML(año)}
    </div>
  `;


  tarjeta.onclick =
    function() {

      abrirFichaOpenLibrary({

        tipo:
          "openlibrary",

        key:
          libro.key
          || libro.keyLibro
          || titulo + autor,

        titulo:
          titulo,

        autor:
          autor,

        año:
          año,

        coverId:
          coverId

      });

    };


  contenedor.appendChild(
    tarjeta
  );

}


/* =========================
   TARJETA GUTENBERG
========================= */

function pintarLibroGratis(
  libro,
  contenedor
) {

  const titulo =
    libro.title
    || libro.titulo
    || "Sin título";


  let autor =
    libro.autor
    || "Autor desconocido";


  if (
    libro.authors
    &&
    libro.authors.length
  ) {

    autor =
      libro.authors[0].name;

  }


  const portada =
    libro.portada
    || libro.formats?.["image/jpeg"]
    || null;


  const gutenbergId =
    libro.id
    || libro.gutenbergId;


  const tarjeta =
    document.createElement("article");


  tarjeta.className =
    "libro";


  tarjeta.innerHTML = `

    <div class="portada-wrap">

      ${
        portada

        ? `
          <img
            src="${portada}"
            alt="${escaparHTML(titulo)}"
          >
        `

        : `
          <div class="sin-portada">
            📚
          </div>
        `
      }

    </div>

    <h3>
      ${escaparHTML(titulo)}
    </h3>

    <p>
      ${escaparHTML(autor)}
    </p>

    <div class="anio gratis">
      🟢 Gratis
    </div>
  `;


  tarjeta.onclick =
    function() {

      abrirFichaGratis({

        tipo:
          "gutenberg",

        id:
          gutenbergId,

        gutenbergId:
          gutenbergId,

        key:
          "gutenberg-"
          + gutenbergId,

        titulo:
          titulo,

        autor:
          autor,

        portada:
          portada,

        descripcion:
          libro.descripcion
          || null

      });

    };


  contenedor.appendChild(
    tarjeta
  );

}


/* =========================
   FICHA OPEN LIBRARY
========================= */

async function abrirFichaOpenLibrary(
  libro
) {

  libroSeleccionado =
    libro;


  ocultarPantallas();


  document
    .getElementById("pantallaFicha")
    .classList
    .remove("oculto");


  const ficha =
    document
      .getElementById("contenidoFicha");


  ficha.innerHTML = `
    <div class="cargando">
      Cargando ficha...
    </div>
  `;


  let descripcion =
    "No hay una reseña disponible para este libro.";


  try {

    if (
      libro.key
      &&
      libro.key.startsWith("/works/")
    ) {

      const respuesta =
        await fetch(
          "https://openlibrary.org"
          + libro.key
          + ".json"
        );


      if (respuesta.ok) {

        const datos =
          await respuesta.json();


        if (
          typeof datos.description
          === "string"
        ) {

          descripcion =
            datos.description;

        }

        else if (
          datos.description?.value
        ) {

          descripcion =
            datos.description.value;

        }

      }

    }

  }

  catch (error) {

    console.log(
      "No se pudo cargar descripción."
    );

  }


  libroSeleccionado.descripcion =
    descripcion;


  pintarFichaComun(
    libroSeleccionado,
    false
  );

}


/* =========================
   FICHA GUTENBERG
========================= */

async function abrirFichaGratis(
  libro
) {

  libroSeleccionado =
    libro;


  ocultarPantallas();


  document
    .getElementById("pantallaFicha")
    .classList
    .remove("oculto");


  document
    .getElementById("contenidoFicha")
    .innerHTML = `
      <div class="cargando">
        Cargando ficha...
      </div>
    `;


  if (!libro.descripcion) {

    libro.descripcion =
      await buscarDescripcion(
        libro.titulo,
        libro.autor
      );

  }


  libroSeleccionado =
    libro;


  pintarFichaComun(
    libro,
    true
  );

}


/* =========================
   BUSCAR RESEÑA
========================= */

async function buscarDescripcion(
  titulo,
  autor
) {

  try {

    const respuesta =
      await fetch(
        "https://openlibrary.org/search.json?q="
        + encodeURIComponent(
          titulo + " " + autor
        )
        + "&fields=key,title,author_name"
        + "&limit=5"
      );


    if (!respuesta.ok) {

      return "No hay una reseña disponible para este libro.";

    }


    const datos =
      await respuesta.json();


    const obra =
      datos.docs?.find(
        libro =>
          libro.key
          &&
          libro.key.startsWith("/works/")
      );


    if (!obra) {

      return "No hay una reseña disponible para este libro.";

    }


    const respuestaObra =
      await fetch(
        "https://openlibrary.org"
        + obra.key
        + ".json"
      );


    if (!respuestaObra.ok) {

      return "No hay una reseña disponible para este libro.";

    }


    const datosObra =
      await respuestaObra.json();


    if (
      typeof datosObra.description
      === "string"
    ) {

      return datosObra.description;

    }


    if (
      datosObra.description?.value
    ) {

      return datosObra.description.value;

    }


  }

  catch (error) {

    console.log(
      "No se pudo obtener reseña."
    );

  }


  return "No hay una reseña disponible para este libro.";

}


/* =========================
   PINTAR FICHA
========================= */

function pintarFichaComun(
  libro,
  esGratis
) {

  const ficha =
    document
      .getElementById("contenidoFicha");


  const guardado =
    biblioteca.find(
      item =>
        item.key === libro.key
    );


  const estadoActual =
    guardado
      ? `
        <div class="estado-actual">
          Guardado en:
          ${nombreEstado(
            guardado.estado
          )}
        </div>
      `
      : "";


  let portada = "";


  if (
    esGratis
    &&
    libro.portada
  ) {

    portada = `
      <img
        class="ficha-portada"
        src="${libro.portada}"
        alt="${escaparHTML(libro.titulo)}"
      >
    `;

  }

  else if (
    !esGratis
    &&
    libro.coverId
  ) {

    portada = `
      <img
        class="ficha-portada"
        src="https://covers.openlibrary.org/b/id/${libro.coverId}-L.jpg"
        alt="${escaparHTML(libro.titulo)}"
      >
    `;

  }

  else {

    portada = `
      <div class="ficha-sin-portada">
        📚
      </div>
    `;

  }


  const lectura =
    esGratis
      ? `
        <div class="disponibilidad disponible">
          🟢 Libro gratuito de dominio público
        </div>

        <button
          class="btn-leer"
          onclick="abrirLector()"
        >
          📖 Leer
        </button>
      `
      : `
        <div class="disponibilidad">
          ℹ️ Ficha del catálogo general
        </div>
      `;


  ficha.innerHTML = `

    ${portada}

    <h2>
      ${escaparHTML(libro.titulo)}
    </h2>

    <p class="ficha-autor">
      ${escaparHTML(libro.autor)}
    </p>

    ${
      libro.año
        ? `<p>${escaparHTML(libro.año)}</p>`
        : ""
    }

    ${lectura}

    <h3>
      Sobre este libro
    </h3>

    <p class="descripcion">
      ${escaparHTML(
        libro.descripcion
        || "No hay una reseña disponible para este libro."
      )}
    </p>

    ${estadoActual}

    <div class="acciones">

      <button
        class="btn-guardar"
        onclick="guardarLibro('quiero')"
      >
        ❤️ Quiero leer
      </button>

      <button
        class="btn-guardar"
        onclick="guardarLibro('leyendo')"
      >
        📖 Estoy leyendo
      </button>

      <button
        class="btn-guardar"
        onclick="guardarLibro('leidos')"
      >
        ✅ Leído
      </button>

    </div>
  `;

}


/* =========================
   LECTOR
========================= */

async function abrirLector() {

  if (
    !libroSeleccionado
    ||
    libroSeleccionado.tipo !== "gutenberg"
  ) {

    return;

  }


  const id =
    libroSeleccionado.gutenbergId
    || libroSeleccionado.id;


  if (!id) {

    alert(
      "No se ha encontrado el identificador del libro."
    );

    return;

  }


  /*
    Construimos nosotros la URL.
  */

  const urlLibro =
    "https://www.gutenberg.org/cache/epub/"
    + id
    + "/pg"
    + id
    + ".txt";


  ocultarPantallas();


  document
    .getElementById("pantallaLector")
    .classList
    .remove("oculto");


  const lector =
    document
      .getElementById("contenidoLector");


  lector.innerHTML = `
    <div class="cargando">
      📖 Cargando libro...
    </div>
  `;


  try {

    const urlWorker =
      WORKER_URL
      + "?url="
      + encodeURIComponent(
        urlLibro
      );


    const respuesta =
      await fetch(
        urlWorker
      );


    if (!respuesta.ok) {

      throw new Error(
        "Error al cargar el libro."
      );

    }


    const contenido =
      await respuesta.text();


    lector.innerHTML = `

      <div class="lector-cabecera">

        <h2>
          ${escaparHTML(
            libroSeleccionado.titulo
          )}
        </h2>

        <p>
          ${escaparHTML(
            libroSeleccionado.autor
          )}
        </p>

      </div>

      <div class="lector-texto">
        ${escaparHTML(contenido)}
      </div>
    `;


    window.scrollTo(
      0,
      0
    );


  }

  catch (error) {

    console.error(error);


    lector.innerHTML = `

      <h3>
        ❌ No se ha podido cargar el libro.
      </h3>

      <p>
        No se ha encontrado una versión de texto compatible para este libro.
      </p>
    `;

  }

}


/* =========================
   VOLVER A FICHA
========================= */

function volverFicha() {

  if (!libroSeleccionado) {

    volverInicio();

    return;

  }


  if (
    libroSeleccionado.tipo === "gutenberg"
  ) {

    abrirFichaGratis(
      libroSeleccionado
    );

  }

  else {

    abrirFichaOpenLibrary(
      libroSeleccionado
    );

  }

}


/* =========================
   GUARDAR
========================= */

function guardarLibro(
  estado
) {

  if (!libroSeleccionado) {
    return;
  }


  const existente =
    biblioteca.find(
      libro =>
        libro.key === libroSeleccionado.key
    );


  if (existente) {

    Object.assign(
      existente,
      libroSeleccionado
    );

    existente.estado =
      estado;

  }

  else {

    biblioteca.push({

      ...libroSeleccionado,

      estado:
        estado

    });

  }


  guardarBiblioteca();


  alert(
    "Libro guardado en "
    + nombreEstado(estado)
  );


  pintarFichaComun(
    libroSeleccionado,
    libroSeleccionado.tipo === "gutenberg"
  );

}


/* =========================
   MI BIBLIOTECA
========================= */

function abrirBiblioteca(
  estado
) {

  ocultarPantallas();


  document
    .getElementById("pantallaBiblioteca")
    .classList
    .remove("oculto");


  document
    .getElementById("tituloBiblioteca")
    .textContent =
      nombreEstado(estado);


  const lista =
    document
      .getElementById("listaBiblioteca");


  lista.innerHTML = "";


  const libros =
    biblioteca.filter(
      libro =>
        libro.estado === estado
    );


  if (!libros.length) {

    lista.innerHTML =
      "<p>No tienes libros aquí todavía.</p>";

    return;

  }


  libros.forEach(
    libro => {

      if (
        libro.tipo === "gutenberg"
      ) {

        pintarLibroGratis(
          libro,
          lista
        );

      }

      else {

        pintarLibroOpenLibrary(
          libro,
          lista
        );

      }

    }
  );

}


/* =========================
   VOLVER
========================= */

function volverInicio() {

  ocultarPantallas();


  document
    .getElementById("pantallaInicio")
    .classList
    .remove("oculto");


  actualizarContadores();


  window.scrollTo(
    0,
    0
  );

}


/* =========================
   ENTER
========================= */

document
  .getElementById("buscador")
  .addEventListener(
    "keydown",
    function(evento) {

      if (evento.key === "Enter") {

        buscarLibros();

      }

    }
  );


actualizarContadores();

</script>
